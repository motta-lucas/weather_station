services:
  api:
    build: .
    image: weather_station_api:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    networks:
      - backend
    env_file:
      - .env
    restart: unless-stopped
  
  database:
    image: mongo:8
    ports:
      - "27017"
    volumes:
      - data:/data/db
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped
  
networks:
  backend:

volumes:
  data: