services:
  api:
    image: ${API_IMAGE}:${API_IMAGE_TAG}
    command: uvicorn main:app --host 0.0.0.0 --port ${API_PORT}
    expose:
      - "${API_PORT}"
    networks:
      - backend
    env_file:
      - .env
    restart: unless-stopped

  database:
    image: mongo:${MONGO_IMAGE_TAG}
    ports:
      - "${MONGO_PORT}"
    volumes:
      - data:/data/db
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:${NGINX_IMAGE_TAG}
    ports:
      - "${NGINX_HOST_PORT}:${NGINX_CONTAINER_PORT}"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      NGINX_PORT: ${NGINX_CONTAINER_PORT}
      SERVER_NAME: ${SERVER_NAME}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  data:
